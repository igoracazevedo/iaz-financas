name: Build Android APK (Super&Farma IAZ)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android & Generate Icons
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --no-save
          npx cap add android
          mkdir -p assets
          cp public/icon-512.png assets/icon.png
          cp public/icon-512.png assets/splash.png
          npx capacitor-assets generate --android || true
          npx cap sync android

      - name: Configure Android Camera & Media Permissions (Manifest + Runtime)
        run: |
          python3 - << 'EOF'
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              xml = f.read()

          camera_permissions = """
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
          """
          if "android.permission.CAMERA" not in xml:
              xml = xml.replace("</manifest>", camera_permissions + "\n</manifest>")
          if 'android:usesCleartextTraffic="true"' not in xml:
              xml = xml.replace("<application", '<application android:usesCleartextTraffic="true"')
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(xml)
          EOF

          cat > android/app/src/main/java/br/com/iaz/superfarma/MainActivity.java << 'EOF'
          package br.com.iaz.superfarma;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final int CAMERA_PERMISSION_REQUEST_CODE = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  ensureCameraPermission();
                  try {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          WebSettings settings = getBridge().getWebView().getSettings();
                          settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      }
                  } catch (Exception ignored) {}
              }

              private void ensureCameraPermission() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(
                          this,
                          new String[]{Manifest.permission.CAMERA},
                          CAMERA_PERMISSION_REQUEST_CODE
                      );
                  }
              }
          }
          EOF

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SuperFarma-IAZ.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperFarma-IAZ-APK
          path: SuperFarma-IAZ.apk

      - name: Publish APK to GitHub Releases (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Super&Farma IAZ — Aplicativo Android (APK)"
          body: "Instalador oficial do aplicativo Android **Super&Farma IAZ** (`SuperFarma-IAZ.apk`). Baixe no celular Android e toque para instalar."
          files: SuperFarma-IAZ.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
