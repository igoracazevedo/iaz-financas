  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">SUPER&amp;FARMA <tspan fill="#34d399">IAZ</tspan></text>
