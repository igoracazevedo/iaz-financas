<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="pharmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />

  <!-- Pharmacy Cross Badge (Top Right) -->
  <g transform="translate(310, 72)">
    <rect x="0" y="0" width="124" height="124" rx="34" fill="url(#pharmaGrad)" stroke="#ffffff" stroke-width="6" />
    <path d="M62 32v60M32 62h60" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
  </g>

  <!-- Supermarket Shopping Cart (Center-Left) -->
