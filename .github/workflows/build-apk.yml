name: Build Android APK (Super&Farma IAZ)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      - name: Add Capacitor Android & Generate Icons
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --no-save
          npx cap add android
          mkdir -p assets
          cp public/icon-512.png assets/icon.png
          cp public/icon-512.png assets/splash.png
          npx capacitor-assets generate --android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SuperFarma-IAZ.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperFarma-IAZ-APK
          path: SuperFarma-IAZ.apk

      - name: Publish APK to GitHub Releases (Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Super&Farma IAZ — Aplicativo Android (APK)"
          body: "Instalador oficial do aplicativo Android **Super&Farma IAZ** (`SuperFarma-IAZ.apk`). Baixe no celular Android e toque para instalar."
          files: SuperFarma-IAZ.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
